# Render.com blueprint for the FastAPI backend.
# Deploy: New + -> Blueprint, point at this repo (Render reads this file).
#
# `name` MUST stay `parley-meeting`.
#
# Render matches a blueprint to an existing service by name. Rename it here
# and the sync does not rename the service - it creates a second one, with no
# environment variables and its own database. That is not hypothetical: a sync
# on 2026-09-09 did exactly that, and the duplicate sat broken until it was
# deleted on 2026-09-14.
#
# The public hostname is NOT derived from `name`. It comes from the service's
# `slug`, which is fixed when the service is created and never follows a
# rename - here the slug is `zoom-clone-api-in8u`, left over from the original
# project name, so the service answers on
# https://zoom-clone-api-in8u.onrender.com no matter what it is called.
#
# The only way to a tidier .onrender.com URL is a brand new service, which
# means new env vars, a new DATABASE_URL, and the duplicate accident again.
# It is not worth it, and it is not needed: the service is fronted by
# https://parleyapi.vipinkarthic.com, which is the name to use everywhere -
# in the frontend build, in documentation, and on a CV. Treat the
# onrender.com hostname as an implementation detail.
services:
  - type: web
    name: parley-meeting
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations run before the server starts. Alembic owns the schema now -
    # the app no longer creates tables on boot, and refuses to start if the
    # schema is missing rather than papering over a failed migration.
    # Safe on the free tier because it runs exactly one instance.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production            # hard-fails the boot if JWT_SECRET is unset
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong random secret
      - key: FRONTEND_URL
        sync: false                  # https://parley.vipinkarthic.com - builds the invite links
      - key: CORS_ORIGINS
        sync: false                  # https://parley.vipinkarthic.com. The custom domain MUST be
                                     # listed: main.py's allow_origin_regex only covers
                                     # *.vercel.app, so a custom domain matches nothing and gets
                                     # a 400 preflight. No trailing slash, scheme required -
                                     # Starlette compares the Origin header as an exact string.
      - key: SMTP_USER
        sync: false                  # sending mailbox; required with SMTP_PASS for real email
      - key: SMTP_PASS
        sync: false                  # Gmail App Password. Blank (or no SMTP_USER) = dev-mode OTP
      - key: DATABASE_URL
        sync: false                  # Neon POOLED string (host contains "-pooler").
                                     # Required: the app refuses to boot without it.
      - key: SEED_SAMPLE_DATA
        value: "false"               # demo accounts always seed; sample meetings would
                                     # be seeded once against a persistent DB and then
                                     # sit at a fixed past date forever. Keep off.
      # TURN. Declared here ONLY so a blueprint sync cannot drop them: an env
      # var absent from the blueprint can be removed on sync, and falling back
      # to the in-code Open Relay default is not a degradation - that endpoint
      # refuses every allocation, so peers behind symmetric NAT lose video
      # outright. `sync: false` keeps the real values in the dashboard, which
      # is where they belong.
      #
      # PASTE THESE INTO THE DASHBOARD BY HAND, NEVER THROUGH A SHELL. The "?"
      # in "?transport=tcp" is a glob metacharacter; a value that loses it
      # makes `new RTCPeerConnection` THROW rather than degrade, and that took
      # video down in production until 2026-09-14.
      - key: TURN_URLS
        sync: false                  # comma-separated; keep every "?transport=tcp" intact
      - key: TURN_USERNAME
        sync: false                  # from the relay provider, not a Parley account
      - key: TURN_CREDENTIAL
        sync: false                  # rotate here; /api/ice serves it, so no rebuild needed
