# Render.com blueprint for the FastAPI backend.
# Deploy: New + -> Blueprint, point at this repo (Render reads this file).
#
# `name` MUST match the live service, because Render treats a renamed service
# in a blueprint as a brand new one - new URL, no environment variables
# carried over. That already happened once: this file said `parley-api` while
# the live service was named differently, and a sync on 2026-09-09 created a
# second web service (`parley-api`, https://parley-api-jtza.onrender.com)
# which has no env vars and has been stuck in update_failed ever since. It
# still auto-deploys from main, so it fails again on every push.
#
# The live service is `parley-meeting`, which serves
# https://zoom-clone-api-in8u.onrender.com - the URL baked into the deployed
# frontend bundle and fronted by parleyapi.vipinkarthic.com. The name is
# historical; the URL is what matters and cannot be changed.
#
# So this file now names the real service. Before syncing the blueprint,
# delete or suspend the orphaned `parley-api` service, or a sync will simply
# feed the broken duplicate again.
services:
  - type: web
    name: parley-meeting
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations run before the server starts. Alembic owns the schema now -
    # the app no longer creates tables on boot, and refuses to start if the
    # schema is missing rather than papering over a failed migration.
    # Safe on the free tier because it runs exactly one instance.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production            # hard-fails the boot if JWT_SECRET is unset
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong random secret
      - key: FRONTEND_URL
        sync: false                  # set to your Vercel URL (e.g. https://your-app.vercel.app)
      - key: CORS_ORIGINS
        sync: false                  # your Vercel URL; *.vercel.app is also allowed automatically
      - key: SMTP_USER
        sync: false                  # sending mailbox; required with SMTP_PASS for real email
      - key: SMTP_PASS
        sync: false                  # Gmail App Password. Blank (or no SMTP_USER) = dev-mode OTP
      - key: DATABASE_URL
        sync: false                  # Neon POOLED string (host contains "-pooler").
                                     # Required: the app refuses to boot without it.
      - key: SEED_SAMPLE_DATA
        value: "false"               # demo accounts always seed; sample meetings would
                                     # be seeded once against a persistent DB and then
                                     # sit at a fixed past date forever. Keep off.
