# Render.com blueprint for the FastAPI backend.
# Deploy: New + -> Blueprint, point at this repo (Render reads this file).
# NOTE: `name` was zoom-clone-api. Render treats a renamed service in a
# blueprint as a NEW service - rename it in the dashboard first, or expect a
# fresh service (new URL, env vars not carried over) on the next sync.
services:
  - type: web
    name: parley-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations run before the server starts. Alembic owns the schema now -
    # the app no longer creates tables on boot, and refuses to start if the
    # schema is missing rather than papering over a failed migration.
    # Safe on the free tier because it runs exactly one instance.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production            # hard-fails the boot if JWT_SECRET is unset
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong random secret
      - key: FRONTEND_URL
        sync: false                  # set to your Vercel URL (e.g. https://your-app.vercel.app)
      - key: CORS_ORIGINS
        sync: false                  # your Vercel URL; *.vercel.app is also allowed automatically
      - key: SMTP_USER
        sync: false                  # sending mailbox; required with SMTP_PASS for real email
      - key: SMTP_PASS
        sync: false                  # Gmail App Password. Blank (or no SMTP_USER) = dev-mode OTP
      - key: DATABASE_URL
        sync: false                  # Neon POOLED string (host contains "-pooler").
                                     # Required: the app refuses to boot without it.
      - key: SEED_SAMPLE_DATA
        value: "false"               # demo accounts always seed; sample meetings would
                                     # be seeded once against a persistent DB and then
                                     # sit at a fixed past date forever. Keep off.
